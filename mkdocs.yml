site_name: PatentPal — Customer Docs
site_description: Deployment, configuration, and security documentation for PatentPal customers.
site_url: https://angelinaalexroopa.github.io/patentpal-docs/
repo_url: https://github.com/angelinaalexroopa/patentpal-docs
repo_name: angelinaalexroopa/patentpal-docs
docs_dir: docs
site_dir: site

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - toc.follow
    - content.code.copy
    - search.suggest

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets

nav:
  - Home: index.md
  - Deploying PatentPal:
      - Overview & tiers: deploy-guide/index.md
      - Standalone quickstart: deploy-guide/standalone.md
      - Compose & Kubernetes: deploy-guide/compose-and-kubernetes.md
      - Fully local (air-gapped): deploy-guide/fully-local.md
      - Data flow & security: deploy-guide/data-flow-and-security.md
  - Configuration reference: handbook/configuration.md
  - Architecture decisions:
      - "Not a legal opinion (ADR 0004)": adr/0004-triage-score-not-legal-opinion.md
      - "Standalone-first packaging (ADR 0009)": adr/0009-standalone-first-packaging.md
      - "SSO / OIDC (ADR 0012)": adr/0012-oidc-sso.md
